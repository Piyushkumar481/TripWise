spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  application:
    name: tripwise
  ai:
    retry:
      # Spring AI retries are disabled; the Google SDK client also uses one attempt.
      max-attempts: 0
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.6-flash
          temperature: 0.7

  jpa:
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    root: INFO

tripwise:
  ai:
    rate-limit:
      calls-per-window: 5
      window-seconds: 60
      calls-per-day: 30
    output-tokens:
      itinerary: 8192
      chat: 2048
      recommendation: 2048
      modification: 8192
      budget-optimization: 2048
      diagnostic: 512
  documents:
    max-file-size-bytes: 10485760
    allowed-content-types:
      - application/pdf
      - image/jpeg
      - image/png
    storage:
      provider: ${TRIPWISE_STORAGE_PROVIDER:local}
      local-directory: ${TRIPWISE_DOCUMENT_STORAGE:./storage/documents}
      azure:
        connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
        container-name: ${AZURE_STORAGE_CONTAINER:tripwise-documents}
